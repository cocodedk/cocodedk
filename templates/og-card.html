<!--
  Source of images/share-atelier-1200x630.png, the picture shown when cocode.dk is shared.
  It borrows the site's own plates and stylesheets, so it cannot drift from the page. To redraw it:
    OG_CARD=1 npm run build
    chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=6000 --screenshot=images/share-atelier-1200x630.png "file://$PWD/dist/og-card.html"
-->
<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>cocode.dk, delebillede</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/page.css">
<style>
html,body{width:1200px;height:630px;overflow:hidden}
.card{display:grid;grid-template-columns:1fr 368px;gap:64px;align-items:center;height:630px;padding:0 84px 0 80px;box-sizing:border-box}
.card .wordmark{font-size:2.1rem;min-height:0;margin-bottom:64px}
.card .sc{font-size:1.4rem;margin:0 0 18px}
.card h1{font-size:3.2rem;line-height:1.1}
.card h1 span{display:block}
.card h1 span + span{margin-top:.28em;padding-left:0;text-indent:0;color:var(--lapis)}
.card .specimen__grid{grid-template-columns:repeat(2,1fr)}
</style>
</head>
<body>
<%= partials.sprite %>
<div class="card">
  <div>
    <span class="wordmark">cocode<i>.</i>dk</span>
    <p class="sc">Babak Bandpey, AI-konsulent</p>
    <h1><span>Jeg hjælper virksomheder med at bruge AI.</span> <span>Og jeg bygger selv det, jeg anbefaler.</span></h1>
  </div>
  <div class="mount specimen__grid">
    <svg viewBox="0 0 600 600"><use href="#art-weather"/></svg>
    <svg viewBox="0 0 600 600"><use href="#art-measure"/></svg>
    <svg viewBox="0 0 600 600"><use href="#art-swan"/></svg>
    <svg viewBox="0 0 600 600"><use href="#art-parvaz"/></svg>
    <svg viewBox="0 0 600 600"><use href="#art-mail"/></svg>
    <svg viewBox="0 0 600 600"><use href="#art-therapy"/></svg>
  </div>
</div>
</body>
</html>
